
services:
  app:
    image: jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "${NPM_UI_PORT}:81"
    environment:
      - DB_TYPE=postgres
      - DB_PG_HOST=postgres
      - DB_PG_PORT=5432
      - DB_PG_NAME=${POSTGRES_DB}
      - DB_PG_USER=${POSTGRES_USER}
      - DB_PG_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - postgres
    networks:
      - proxy_network

  postgres:
    image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
    container_name: nginx-proxy-manager-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - npm_postgres_data:/var/lib/postgresql/data
    networks:
      - proxy_network

volumes:
  npm_data:
  npm_letsencrypt:
  npm_postgres_data:

networks:
  proxy_network:
    driver: bridge