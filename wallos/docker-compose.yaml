
services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.1.1@sha256:350d8fe7f963477ed92b6ff96c8b220ed5bfb6c3b9eb8d3229025d132701c04e
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Toronto'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped