
services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.8.2@sha256:14a1255d806c2f1e03317a7d98fce5ac58ea2437aae0b66234aae7b53751edf9
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Toronto'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped