
services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.4.5@sha256:2ad6f504f555d99bf47abf6cdad416d748982b7056c7e1c6e3cd4e1f2ef41606
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Toronto'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped