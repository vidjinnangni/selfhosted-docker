
services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.0.0@sha256:8ebde07dbdd34eb671ef40560fd9503c5f995d4594c169a08cf93288d5a1b8e9
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Toronto'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped