
services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.5.1@sha256:6045bcc9ae548a0a977f2a9efa2a2c2ab552d17ad3d85c7bb9ff4ed9cdaa6f7f
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Toronto'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped